{% extends "base.html" %}
{% from "_macros.html" import status_warn %}

{% block title %}Вход · Нотариальная контора{% endblock %}

{% block content %}
<section class="panel">
  <div class="panel__head">
    <h1 class="panel__title">Вход в портал</h1>
    <span class="panel__hint">Только для сотрудников конторы</span>
  </div>

  {% if error %}
  {{ status_warn(error) }}
  {% endif %}

  <form class="calc__form" method="post" action="/auth/login">
    <div class="field">
      <label for="full_name">Имя</label>
      <input id="full_name" name="full_name" type="text" value="{{ full_name }}" required
             autocomplete="username" placeholder="Иванов Иван Иванович">
    </div>

    <div class="field">
      <label for="password">Пароль</label>
      <input id="password" name="password" type="password" required autocomplete="current-password">
    </div>

    <div class="calc__row">
      <button class="btn btn--primary" type="submit">Войти</button>
      <span class="panel__hint">Русские буквы, пробел и дефис</span>
    </div>
  </form>
</section>
{% endblock %}
