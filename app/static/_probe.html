<!DOCTYPE html>
<html lang="ru">
<head><meta charset="utf-8"><title>layout probe</title></head>
<body style="margin:0;overflow:hidden">
<pre id="out" style="position:fixed;left:-10000px;top:0"></pre>
<iframe id="frame" style="border:0;display:block" src="about:blank"></iframe>
<script>
(function () {
  var hash = {};
  location.hash.replace(/^#/, '').split('&').forEach(function (kv) {
    var i = kv.indexOf('=');
    if (i < 0) { return; }
    hash[decodeURIComponent(kv.slice(0, i))] = decodeURIComponent(kv.slice(i + 1));
  });
  var out = document.getElementById('out');
  var frame = document.getElementById('frame');
  var log = [];
  var rowCount = parseInt(hash.rows || '0', 10);
  var state = hash.scroll || 'none';
  var doShell = hash.shell === '1';

  if (hash.token) { document.cookie = 'portal_token=' + hash.token + '; path=/'; }

  frame.style.width = window.innerWidth + 'px';
  frame.style.height = window.innerHeight + 'px';

  function shellMarkup(doc) {
    var rows = '', i;
    for (i = 1; i <= 25; i++) {
      rows += '<tr><td>Сотрудник ' + i + '</td><td>Сотрудник</td><td class="mono">pass' + i +
              '</td><td class="mono">13.10.2026</td><td><a class="btn btn--ghost" href="#">Изменить</a></td></tr>';
    }
    doc.querySelector('.workspace').innerHTML =
      '<section class="panel" id="edit-panel"><div class="panel__head"><h1 class="panel__title">Новый сотрудник</h1>' +
      '<span class="panel__hint">Доступно администратору портала</span></div>' +
      '<form class="calc__form"><div class="field"><label for="a">Имя (ФИО)</label><input id="a" type="text"></div>' +
      '<div class="field"><label for="b">Пароль</label><input id="b" type="password"></div>' +
      '<div class="field"><label for="c">Роль</label><select id="c"><option>Сотрудник</option></select></div>' +
      '<div class="calc__row"><button class="btn btn--primary" type="button">Добавить сотрудника</button></div></form></section>' +
      '<section class="panel"><div class="panel__head"><h2 class="panel__title">Список сотрудников</h2>' +
      '<span class="panel__hint">Всего: 25</span></div>' +
      '<div class="table-wrap"><table class="table"><thead><tr><th>Имя (логин)</th><th>Роль</th><th>Пароль</th>' +
      '<th>Создан</th><th>Действия</th></tr></thead><tbody>' + rows + '</tbody></table></div></section>';
  }

  function injectRows(n) {
    var tb = frame.contentDocument.querySelector('.table tbody');
    if (!tb || !n) { return 0; }
    var proto = tb.querySelector('tr'), made = 0, i;
    for (i = 0; i < n; i++) { tb.appendChild(proto.cloneNode(true)); made++; }
    return made;
  }

  function metrics() {
    var doc = frame.contentDocument, win = frame.contentWindow;
    var ws = doc.querySelector('.workspace'), app = doc.querySelector('.app'), de = doc.documentElement;
    var last = doc.querySelector('.table tbody tr:last-child');
    ws.scrollTop = 0;
    var s0 = ws.scrollTop;
    ws.scrollTop = 100000;
    var max = ws.scrollTop;
    var wsRect = ws.getBoundingClientRect(), lastRect = last.getBoundingClientRect();
    return {
      path: win.location.pathname,
      viewport: window.innerWidth + 'x' + window.innerHeight,
      innerH: win.innerHeight,
      docScrollH: de.scrollHeight, docClientH: de.clientHeight, pageScrolls: de.scrollHeight > de.clientHeight,
      appH: Math.round(app.getBoundingClientRect().height),
      wsClient: ws.clientHeight, wsScroll: ws.scrollHeight,
      wsOverflowY: win.getComputedStyle(ws).overflowY,
      wsScrollable: max > s0, scrollTopMax: Math.round(max),
      lastRowBottom: Math.round(lastRect.bottom), wsBottom: Math.round(wsRect.bottom),
      lastRowVisible: lastRect.bottom <= wsRect.bottom + 1 && lastRect.top >= wsRect.top - 1,
      rows: doc.querySelectorAll('.table tbody tr').length
    };
  }

  function finish(result) {
    out.textContent = '@@BEGIN@@' + JSON.stringify({ log: log, result: result }, null, 1) + '@@END@@';
  }

  frame.onload = function () {
    frame.onload = null;
    try {
      if (doShell) { shellMarkup(frame.contentDocument); log.push('shell markup injected'); }
      if (rowCount) { log.push('injected rows: ' + injectRows(rowCount)); }
      var res = metrics();
      var ws = frame.contentDocument.querySelector('.workspace');
      if (state === 'bottom') {
        ws.scrollTop = 100000;
        var r = ws.getBoundingClientRect(), l = frame.contentDocument.querySelector('.table tbody tr:last-child').getBoundingClientRect();
        res.scrollTopAfter = Math.round(ws.scrollTop);
        res.lastRowVisibleAtBottom = l.bottom <= r.bottom + 1 && l.top >= r.top - 1;
      } else {
        ws.scrollTop = 0;
      }
      finish(res);
    } catch (e) {
      log.push('ERROR: ' + e);
      finish({});
    }
  };

  frame.src = hash.url || '/auth/users';
})();
</script>
</body>
</html>
